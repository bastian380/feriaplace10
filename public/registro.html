<title>Crear cuenta - FeriaPlace</title>
<link rel="stylesheet" href="css/style.css">
<header>
  <a href="index.html">FeriaPlace</a>
  <nav id="nav-sesion"></nav>
</header>
<main>
  <div class="tarjeta" style="max-width:420px;margin:0 auto;">
    <h2>Crear cuenta de comerciante</h2>
    <form id="form-registro">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" required>
      <label for="email">Email</label>
      <input type="email" id="email" required>
      <label for="password">Contraseña</label>
      <input type="password" id="password" minlength="6" required>
      <button type="submit">Crear cuenta</button>
    </form>
    <div id="mensaje"></div>
    <p style="margin-top:16px;font-size:0.9rem;">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/registro.js"></script>
